name: RUNFEST start lists and results
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: runfest-data
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ false }} # Event ended; retain workflow source without fetching data.
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
      - name: Keep RUNFEST lists and results current through race day
        shell: bash
        run: |
          event_day="$(date -u +%Y-%m-%d)"
          if [[ "$event_day" < "2026-10-03" || "$event_day" > "2026-10-04" ]]; then
            exit 0
          fi
          cp scripts/update_runfest.py "$RUNNER_TEMP/update_runfest.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin runfest-data; then
            git fetch origin runfest-data
            git switch -C runfest-data FETCH_HEAD
          else
            git switch --orphan runfest-data
            git rm -rf .
          fi
          rounds=1
          if [[ "$event_day" == "2026-10-03" ]]; then rounds=60; fi
          successful=0
          for ((round=1; round<=rounds; round++)); do
            if python3 "$RUNNER_TEMP/update_runfest.py" "$RUNNER_TEMP/runfest-data.json"; then
              cp "$RUNNER_TEMP/runfest-data.json" runfest-data.json
              git add runfest-data.json
              if ! git diff --cached --quiet; then
                git commit -m "Update RUNFEST start lists and results"
                git push origin HEAD:runfest-data
              fi
              successful=$((successful + 1))
              echo "Published RUNFEST snapshot at $(date -u +%FT%TZ)"
            else
              echo "::warning::EQ Timing fetch failed; keeping the last valid snapshot and retrying."
            fi
            if [[ "$(date -u +%Y-%m-%d)" != "2026-10-03" || "$round" == "$rounds" ]]; then break; fi
            sleep 300
          done
          if [[ "$successful" == "0" ]]; then exit 1; fi
